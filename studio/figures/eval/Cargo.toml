# The Ask-box evaluation (FIG-AI). Its own tiny workspace so the studio's
# workspace and test runs never build or run it. See README.md.
[package]
name = "ntex-figures-eval"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ntex-figures = { path = ".." }
ntex-studio-io = { path = "../../io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
